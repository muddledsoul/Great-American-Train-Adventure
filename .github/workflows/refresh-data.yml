name: Refresh rail data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-data.yml']
  schedule:
    - cron: '17 9 * * 1'   # weekly, Monday 09:17 UTC
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Amtrak route geometry (USDOT NTAD) and station list (Amtraker)
        run: |
          set -e
          mkdir -p data
          curl -fsSL "https://services.arcgis.com/xOi1kZaI0eWDREZv/ArcGIS/rest/services/NTAD_Amtrak_Routes/FeatureServer/0/query?where=1%3D1&outFields=name,ROUTE_URL&outSR=4326&geometryPrecision=4&f=geojson" -o data/routes.geojson
          python3 -c "import json;d=json.load(open('data/routes.geojson'));assert len(d.get('features',[]))>20, 'too few routes';print(len(d['features']),'routes')"
          python3 scripts/simplify_routes.py data/routes.geojson data/routes.geojson 0.002
          curl -fsSL "https://api-v3.amtraker.com/v3/stations" -o data/stations.json
          python3 -c "import json;d=json.load(open('data/stations.json'));assert len(d)>300, 'too few stations';print(len(d),'stations')"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/updated.txt
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh route geometry and station list"
          git push
